<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Daniel Guerrero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #fafaf9;
            --bg-light: #ffffff;
            --accent-1: #d4452c;
            --accent-2: #f4a261;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-light: #f8f6f3;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════════════════════════════ */
        /* HEADER (from A)                         */
        /* ═══════════════════════════════════════ */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: linear-gradient(180deg, var(--bg-dark) 0%, rgba(250, 250, 249, 0.95) 100%, transparent 100%);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        nav a {
            margin-left: 2.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            letter-spacing: 0.02em;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-1);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-1);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ═══════════════════════════════════════ */
        /* HERO (from A)                           */
        /* ═══════════════════════════════════════ */
        .hero {
            padding: 10rem 4rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 300;
            line-height: 1.3;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out 0.3s backwards;
            letter-spacing: -0.02em;
        }

        .hero h1 span {
            display: block;
            font-weight: 600;
            color: var(--accent-1);
        }

        .hero p {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-secondary);
            max-width: 500px;
            animation: fadeInUp 1s ease-out 0.5s backwards;
            line-height: 1.7;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════ */
        /* PROJECT GRID (from B, adapted)          */
        /* ═══════════════════════════════════════ */
        .projects-grid {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 4rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
            gap: clamp(2rem, 4vw, 3.5rem);
            animation: fadeIn 1s ease-out 0.7s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* PROJECT CARD */
        .project-card {
            text-decoration: none;
            color: var(--text-primary);
            display: block;
            cursor: pointer;
        }

        .project-image-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f0efed;
        }

        .project-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
            animation: imgLoad 0.6s ease-in-out;
        }

        @keyframes imgLoad {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        .project-card:hover .project-image-container img {
            transform: scale(1.04);
        }

        /* HOVER OVERLAY */
        .project-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.15) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
        }

        .project-card:hover .project-overlay {
            opacity: 1;
        }

        .project-overlay .project-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
            transform: translateY(12px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.08s, opacity 0.4s ease 0.08s;
        }

        .project-card:hover .project-overlay .project-name {
            transform: translateY(0);
            opacity: 1;
        }

        .project-overlay .project-desc {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-light);
            opacity: 0;
            letter-spacing: 0.04em;
            transform: translateY(10px);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.15s, opacity 0.4s ease 0.15s;
        }

        .project-card:hover .project-overlay .project-desc {
            transform: translateY(0);
            opacity: 0.9;
        }

        /* ═══════════════════════════════════════ */
        /* FOOTER                                  */
        /* ═══════════════════════════════════════ */
        footer {
            padding: 6rem 4rem 3rem;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-light);
            margin-top: 4rem;
        }

        footer p {
            font-size: 0.85rem;
            font-weight: 400;
        }

        /* ═══════════════════════════════════════ */
        /* RESPONSIVE                              */
        /* ═══════════════════════════════════════ */
        @media (max-width: 1024px) {
            header {
                padding: 1.5rem 2rem;
            }

            .hero {
                padding: 8rem 2rem 3rem;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .projects-grid {
                padding: 2rem;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem 1.5rem;
            }

            .logo {
                font-size: 1.1rem;
            }

            nav a {
                margin-left: 1rem;
                font-size: 0.75rem;
            }

            .hero {
                padding: 7rem 1.5rem 2rem;
            }

            .hero h1 {
                font-size: 1.5rem;
            }

            .projects-grid {
                padding: 1.5rem;
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            /* Mobile: overlay always visible */
            .project-overlay {
                opacity: 1;
                background: linear-gradient(0deg, rgba(0, 0, 0, 0.65) 0%, transparent 55%);
            }

            .project-overlay .project-name,
            .project-overlay .project-desc {
                opacity: 1;
                transform: translateY(0);
            }

            footer {
                padding: 4rem 1.5rem 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER (A style) -->
    <header>
        <div class="logo">Daniel Guerrero</div>
        <nav>
            <a href="#trabajos">Servicios</a>
            <a href="#sobre-mi">Sobre mí</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- HERO (A style) -->
    <section class="hero">
        <h1>
            Arquitectura
            <span>Portfolio 2026</span>
        </h1>
        <p>Portfolio de proyectos seleccionados de lo mejor que vengo haciendo este ultimo tiempo.</p>
    </section>

    <!-- PROJECTS GRID (B style + hover overlay) -->
    <section class="projects-grid" id="trabajos"></section>

    <footer>
        <p id="footerText"></p>
    </footer>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // ███████╗██████╗ ██╗████████╗ █████╗     ██████╗ ██╗   ██╗██╗
        // ██╔════╝██╔══██╗██║╚══██╔══╝██╔══██╗    ██╔══██╗██║   ██║██║
        // █████╗  ██║  ██║██║   ██║   ███████║    ███████║██║   ██║██║
        // ██╔══╝  ██║  ██║██║   ██║   ██╔══██║    ██╔══██║██║▄█╗██║██║
        // ███████╗██████╔╝██║   ██║   ██║  ██║    ██║  ██║╚██████╔╝██║
        // ╚══════╝╚═════╝ ╚═╝   ╚═╝   ╚═╝  ╚═╝    ╚═╝  ╚═╝ ╚══▀▀═╝ ╚═╝
        // ═══════════════════════════════════════════════════════════════
        // EDITA ESTA SECCIÓN - TODO LO DEMÁS SE ACTUALIZA AUTOMÁTICAMENTE
        // ═══════════════════════════════════════════════════════════════

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. INFORMACIÓN DEL SITIO
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const SITE_CONFIG = {
            title: "Daniel Guerrero",
            subtitle: "Arquitectura",
            year: "2026"
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. PROYECTOS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //
        // INSTRUCCIONES:
        // - image: ruta de la imagen del proyecto
        // - title: nombre del proyecto (aparece en hover)
        // - description: descripción corta (aparece en hover)
        // - link: enlace a página del proyecto (usa "#" si no tienes)
        //
        // Para agregar más proyectos, copia/pega este bloque:
        // {
        //     image: "ruta/imagen.jpg",
        //     title: "Nombre Proyecto",
        //     description: "Descripción corta",
        //     link: "#"
        // },
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

       const PROJECTS = [
    {
        image: "images/tinyd.jpg",
        title: "Tiny Dormis",
        description: "Arquitectura · Estructura · Visualización",
        link: "proyecto-tinyd.html"
    },
    {
        image: "images/casastabio.jpg",
        title: "Casa Stabio",
        description: "Arquitectura · Visualización",
        link: "proyecto-tinyd.html"
    },
    {
        image: "images/noe.jpg",
        title: "Casa Noe",
        description: "Arquitectura · Visualización",
        link: "proyecto-tinyd.html"
    },
    {
        image: "images/horace_sheraton.jpg",
        title: "Hora Sheraton",
        description: "Interiorismo · Visualización",
        link: "proyecto-tinyd.html"
    },
    {
        image: "images/casamonsemarcio.jpg",
        title: "Casa Monse Marcio",
        description: "Arquitectura · Visualización",
        link: "proyecto-tinyd.html"
    },
    {
        image: "images/san_martin.jpg",
        title: "Casa San Martín",
        description: "Arquitectura · Obra construida",
        link: "proyecto-tinyd.html"
    }
];

        // ═══════════════════════════════════════════════════════════════
        // NO EDITES DEBAJO DE ESTA LÍNEA (código automático)
        // ═══════════════════════════════════════════════════════════════

        // Render footer
        document.getElementById('footerText').textContent =
            `© ${SITE_CONFIG.year} ${SITE_CONFIG.title} · ${SITE_CONFIG.subtitle}`;

        // Render projects
        const container = document.getElementById('trabajos');
        PROJECTS.forEach(project => {
            const card = document.createElement('a');
            card.href = project.link;
            card.className = 'project-card';

            card.innerHTML = `
                <div class="project-image-container">
                    <img src="${project.image}" alt="${project.title}">
                    <div class="project-overlay">
                        <div class="project-name">${project.title}</div>
                        <div class="project-desc">${project.description}</div>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
